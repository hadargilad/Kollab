services:

  frontend:
    build:
      context: ./audio-intel-ui
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    volumes:
      - ./audio-intel-ui:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development

  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    ports:
      - "8001:8001"
    volumes:
      - ./Backend:/app
      - audio_intel_data:/data
    environment:
      - AUDIO_INTEL_DB=/data/AudioIntelDB.db
      - AUDIO_STORAGE_DIR=/data/uploads
      - ML_API_URL=http://ml:8000
      - ENRICHMENT_PROVIDER=${ENRICHMENT_PROVIDER:-wikidata}
      # Cloud state — optional; all blank → fall back to local SQLite + disk.
      - TURSO_URL=${TURSO_URL:-}
      - TURSO_AUTH_TOKEN=${TURSO_AUTH_TOKEN:-}
      - R2_ENDPOINT_URL=${R2_ENDPOINT_URL:-}
      - R2_ACCESS_KEY_ID=${R2_ACCESS_KEY_ID:-}
      - R2_SECRET_ACCESS_KEY=${R2_SECRET_ACCESS_KEY:-}
      - R2_BUCKET=${R2_BUCKET:-}

  ml:
    build:
      context: ./ml
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./ml:/app
      - ml_models:/app/pretrained_models
    environment:
      # Required: each developer sets their own at huggingface.co/settings/tokens
      - HF_TOKEN=${HF_TOKEN:?HF_TOKEN missing — set it in .env (huggingface.co/settings/tokens)}
      - WHISPER_MODEL=${WHISPER_MODEL:-medium}
    profiles:
      - ml

volumes:
  audio_intel_data:
  ml_models:
